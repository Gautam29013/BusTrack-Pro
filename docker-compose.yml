version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bustrakpro_backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://bustrak:bustrak_pass@postgres:5432/bustrakpro
      MONGODB_URI: mongodb://mongo:27017/bustrakpro_locations
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_super_secret_key_min_32_chars_long
      JWT_REFRESH_SECRET: change_this_refresh_secret_key_min_32_chars
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - bustrak_net

  frontend:
    build: ./frontend
    container_name: bustrakpro_frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bustrak_net

  postgres:
    image: postgres:15-alpine
    container_name: bustrakpro_postgres
    environment:
      POSTGRES_DB: bustrakpro
      POSTGRES_USER: bustrak
      POSTGRES_PASSWORD: bustrak_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bustrak -d bustrakpro']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bustrak_net

  mongo:
    image: mongo:7-jammy
    container_name: bustrakpro_mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - bustrak_net

  redis:
    image: redis:7-alpine
    container_name: bustrakpro_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    networks:
      - bustrak_net

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  bustrak_net:
    driver: bridge
